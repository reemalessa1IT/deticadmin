<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة المشرف — ملفات الجريمة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap">
<style>
:root{--bg:#0b0d1f;--card:#12162e;--ink:#eef0ff;--mut:#aab0e6;--line:#3b4280;--hi:#ffc857;--ok:#3df2c9;--bad:#ff6b86;--field:#0a0c1b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f4fb;--card:#fff;--ink:#14172f;--mut:#555b8a;--line:#b9bde0;--hi:#8a5a00;--ok:#007a62;--bad:#c01d44;--field:#f7f8ff}}
:root[data-theme="dark"]{--bg:#0b0d1f;--card:#12162e;--ink:#eef0ff;--mut:#aab0e6;--line:#3b4280;--hi:#ffc857;--ok:#3df2c9;--bad:#ff6b86;--field:#0a0c1b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:1.7rem}
h2{margin:0 0 6px;font-size:1.15rem;color:var(--hi)}
p{margin:0}
.mut{color:var(--mut);font-size:.92rem}
section{background:var(--card);border:2px solid var(--line);box-shadow:4px 4px 0 rgba(0,0,0,.35);padding:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:.95rem}
input{font-family:ui-monospace,Consolas,monospace;font-size:1rem;background:var(--field);color:var(--ink);border:2px solid var(--line);padding:9px;direction:ltr;text-align:left}
button{font-family:inherit;font-weight:800;font-size:1rem;background:#ffc857;color:#1a1405;border:2px solid #000;box-shadow:0 4px 0 #8a6a1f;padding:8px 18px;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6a1f}
button.sec{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:0 3px 0 rgba(0,0,0,.4)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.status{font-weight:800}.status.on{color:var(--ok)}
table{border-collapse:collapse;width:100%}
th,td{border:2px solid var(--line);padding:8px 10px;text-align:center}
th{color:var(--hi);background:var(--field)}
td.star3{color:var(--ok);font-weight:800;font-size:1.15rem}
td:first-child,th:first-child{text-align:start}
#cards2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{border:2px solid var(--line);background:var(--field);padding:12px 8px;text-align:center}
.big .ic{font-size:1.7rem;line-height:1.2}
.big .num{font-size:3.2rem;font-weight:800;color:var(--ok);line-height:1.1}
.big .lbl{font-weight:800}
.big .sub{color:var(--mut);font-size:.9rem}
#lead{font-weight:800;text-align:center;font-size:1.05rem}
.brow{display:flex;flex-direction:column;gap:4px}
.bar{display:flex;height:28px;border:2px solid var(--line);background:var(--field);overflow:hidden}
.bar b{display:flex;align-items:center;justify-content:center;font-size:.9rem;color:#14172f;min-width:0}
.b3{background:#3df2c9}.b2{background:#ffc857}.b1{background:#ff8fa3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--mut)}
.legend i{display:inline-block;width:12px;height:12px;border:1px solid #000;margin-inline-end:5px;vertical-align:-1px}
#msg{min-height:1.5em;font-weight:800;color:var(--bad)}
.hide{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1>لوحة المشرف</h1>
    <p class="mut">اللاعبون لا يستطيعون التحكم بالعدّ: كل الأوامر تحتاج رمزك السري.</p>
  </header>

  <section id="setup">
    <h2>الدخول</h2>
    <label>رمزك السري (نفسه الذي كتبته في ملف supabase.sql)<input id="key" type="password" autocomplete="off"></label>
    <div class="row"><button id="bSave">دخول</button></div>
    <p id="cfgWarn" class="hide" style="color:var(--bad);font-weight:800">ضع SUPABASE_URL و SUPABASE_KEY في أعلى ملف admin.html أولاً.</p>
  </section>

  <section id="panel" class="hide">
    <h2>العدّ</h2>
    <p class="status" id="status">جارٍ التحميل...</p>
    <div class="row">
      <button id="bStart">ابدأ العدّ</button>
      <button id="bStop" class="hide">إنهاء العدّ وعرض الإحصائيات</button>
      <button id="bRefresh" class="sec">تحديث</button>
      <button id="bOut" class="sec">خروج</button>
    </div>
    <p class="mut" id="hintBox"></p>
    <p id="msg" aria-live="polite"></p>
  </section>

  <section id="statsBox" class="hide">
    <h2>الإحصائيات</h2>
    <p class="mut" id="range"></p>
    <div id="cards2"></div>
    <p id="lead"></p>
    <div id="bars" style="display:flex;flex-direction:column;gap:10px"></div>
    <div class="legend"><span><i class="b3"></i>٣ نجوم</span><span><i class="b2"></i>نجمتان</span><span><i class="b1"></i>نجمة</span></div>
    <h2 style="margin-top:6px">الجدول</h2>
    <table>
      <thead><tr><th></th><th>عدد اللاعبين</th><th>٣ نجوم</th><th>نجمتان</th><th>نجمة</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>

<script>
'use strict';
/* بيانات Supabase (من Project Settings ثم API) — هي نفسها الموجودة في index.html */
const SUPABASE_URL='https://rfvextplyscnjvhyesib.supabase.co/rest/v1/';
const SUPABASE_KEY='sb_publishable_0nqcagFduVAxVH1eT9Rz1Q_ue7Ba3ef';

const $=s=>document.querySelector(s);
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const ar=n=>Number(n).toLocaleString('ar-EG');
const fmt=t=>new Date(t).toLocaleString('ar-SA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
let key=store.get('ffk')||'',last=null,armed=null;

async function rpc(name){
  const r=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+name,{
    method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({k:key})
  });
  const txt=await r.text();
  if(!r.ok){const e=new Error(txt);e.bad=/bad key/i.test(txt);throw e}
  return JSON.parse(txt);
}
const setMsg=t=>{$('#msg').textContent=t||''};
async function load(name){
  setMsg('');
  try{last=await rpc(name);render(last)}
  catch(e){
    if(e.bad){setMsg('الرمز السري غير صحيح.');logout(false)}
    else setMsg('تعذّر الاتصال بقاعدة البيانات. تأكد من بيانات Supabase ومن أن المشروع غير متوقف.');
  }
}
function render(d){
  const total=d.m.n+d.f.n,done=!d.active&&d.stop;
  const st=$('#status');
  st.className='status'+(d.active?' on':'');
  st.textContent=d.active?`⏺ العدّ جارٍ منذ ${fmt(d.start)}`:done?`⏹ انتهى العدّ (${fmt(d.start)} ← ${fmt(d.stop)})`:'العدّ متوقف';
  $('#bStart').textContent=done?'إعادة العدّ من جديد':'ابدأ العدّ';
  $('#bStart').classList.toggle('hide',d.active);
  $('#bStop').classList.toggle('hide',!d.active);
  $('#hintBox').textContent=d.active?'تُحتسب نتائج من يختم اللعبة من لحظة البدء فقط. اضغط «إنهاء العدّ» لعرض الإحصائيات.':'اللاعبون يستطيعون اللعب في أي وقت، لكن النتائج لا تُحتسب إلا أثناء العدّ.';
  $('#statsBox').classList.toggle('hide',!done);
  if(!done)return;
  const rows=$('#rows');rows.textContent='';
  const add=(label,o)=>{
    const tr=document.createElement('tr');
    [label,ar(o.n),ar(o.s3),ar(o.s2),ar(o.s1)].forEach((v,i)=>{const td=document.createElement('td');td.textContent=v;if(i===2)td.className='star3';tr.appendChild(td)});
    rows.appendChild(tr);
  };
  drawSummary(d);
  add('👦 أولاد',d.m);add('👧 بنات',d.f);
  add('المجموع',{n:total,s3:d.m.s3+d.f.s3,s2:d.m.s2+d.f.s2,s1:d.m.s1+d.f.s1});
  $('#range').textContent=`الفترة: من ${fmt(d.start)} إلى ${fmt(d.stop)}`;
}
function drawSummary(d){
  const pct=o=>o.n?Math.round(o.s3/o.n*100):0;
  const cards=$('#cards2');cards.textContent='';
  [['👦','أولاد',d.m],['👧','بنات',d.f]].forEach(([ic,name,o])=>{
    const c=document.createElement('div');c.className='big';
    const mk=(cls,t)=>{const e=document.createElement('div');e.className=cls;e.textContent=t;c.appendChild(e)};
    mk('ic',ic+' '+name);mk('num',ar(o.s3));mk('lbl','حصلوا على ٣ نجوم');
    mk('sub',`من أصل ${ar(o.n)} لاعب (${ar(pct(o))}٪)`);
    cards.appendChild(c);
  });
  const diff=d.m.s3-d.f.s3,lead=$('#lead');
  lead.textContent=(d.m.s3+d.f.s3)===0?'لم يحصل أحد على ٣ نجوم في هذه الفترة.':diff===0?`تعادل: ${ar(d.m.s3)} لكل من الأولاد والبنات.`:diff>0?`الأولاد في الصدارة بفارق ${ar(diff)} لاعب.`:`البنات في الصدارة بفارق ${ar(-diff)} لاعبة.`;
  const bars=$('#bars');bars.textContent='';
  [['👦 أولاد',d.m],['👧 بنات',d.f]].forEach(([name,o])=>{
    const row=document.createElement('div');row.className='brow';
    const t=document.createElement('div');t.textContent=`${name} (${ar(o.n)} لاعب)`;t.style.fontWeight='800';row.appendChild(t);
    const bar=document.createElement('div');bar.className='bar';
    [['b3',o.s3],['b2',o.s2],['b1',o.s1]].forEach(([cls,v])=>{
      if(!v)return;const b=document.createElement('b');b.className=cls;b.style.width=(v/o.n*100)+'%';b.textContent=ar(v);bar.appendChild(b);
    });
    row.appendChild(bar);bars.appendChild(row);
  });
}
function logout(clear=true){
  if(clear){key='';store.del('ffk')}
  $('#panel').classList.add('hide');$('#statsBox').classList.add('hide');$('#setup').classList.remove('hide');
}
function enter(){
  $('#setup').classList.add('hide');$('#panel').classList.remove('hide');load('admin_status');
}
$('#bSave').onclick=()=>{
  const v=$('#key').value.trim();if(!v)return;
  key=v;store.set('ffk',key);enter();
};
$('#bOut').onclick=()=>logout(true);
$('#bRefresh').onclick=()=>load('admin_status');
$('#bStop').onclick=()=>load('admin_stop');
$('#bStart').onclick=e=>{
  const b=e.currentTarget,hasOld=last&&(last.m.n+last.f.n)>0;
  if(hasOld&&!armed){
    b.textContent='سيمسح النتائج السابقة. اضغط مرة أخرى للتأكيد';
    armed=setTimeout(()=>{armed=null;render(last)},4000);return;
  }
  clearTimeout(armed);armed=null;load('admin_start');
};
if(!SUPABASE_URL||!SUPABASE_KEY)$('#cfgWarn').classList.remove('hide');
else if(key)enter();
</script>
</body>
</html>
